# Local/dev override — loaded automatically when this file sits in the same folder
# as docker-compose.yml (docker compose uses override.yml by default).
# Unlike docker-compose.yml (prod): source code is bind-mounted (not the built image),
# APP_DEBUG is assumed true, and a Vite service is added for HMR.
services:
  app:
    build:
      target: runtime
    volumes:
      - ..:/var/www/html
      - storage:/var/www/html/storage

  queue:
    volumes:
      - ..:/var/www/html
      - storage:/var/www/html/storage

  nginx:
    volumes:
      - ../public:/var/www/html/public

  vite:
    image: node:20-alpine
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ..:/var/www/html
    ports:
      - "5173:5173"
    env_file: .env
