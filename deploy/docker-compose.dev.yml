# malas-dev: previewer untuk perubahan kode, memakai database utama dengan role read-only (malas_dev).
# Jalankan lewat deploy/dev.sh (project dir = root repo, project name = malas-dev).
name: malas-dev

services:
  dev-app:
    image: malas:latest
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["php-fpm"]
    env_file: [./.env.dev]
    mem_limit: 512m
    volumes:
      - ./app:/var/www/html/app:ro
      - ./routes:/var/www/html/routes:ro
      - ./config:/var/www/html/config:ro
      - ./database:/var/www/html/database:ro
      - ./resources:/var/www/html/resources:ro
      - ./lang:/var/www/html/lang:ro
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php:ro
      - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php:ro
      - ./deploy/dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
      - dev_storage:/var/www/html/storage
      - dev_build:/var/www/html/public/build:ro
    networks: [default, shared_net]

  dev-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:80"
    volumes:
      - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - dev_build:/var/www/html/public/build:ro
      - malas_storage:/var/www/html/storage:ro
    depends_on: [dev-app]

  # Build sekali (default): dev.sh build. Tidak jalan terus-menerus supaya tidak membebani situs rilis.
  dev-build:
    image: node:20-alpine
    profiles: ["build"]
    restart: "no"
    working_dir: /app
    environment:
      NODE_OPTIONS: "--max-old-space-size=1400"
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci --no-audit --no-fund; npx vite build"
    mem_limit: 1800m
    cpus: "1.0"
    volumes:
      - ./:/app:ro
      - dev_node_modules:/app/node_modules
      - dev_build:/app/public/build

  # Opsional untuk sesi panjang: dev.sh watch (build ulang otomatis, memori lebih besar).
  dev-vite:
    image: node:20-alpine
    profiles: ["watch"]
    restart: "no"
    working_dir: /app
    environment:
      NODE_OPTIONS: "--max-old-space-size=1400"
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci --no-audit --no-fund; npx vite build --watch"
    mem_limit: 1800m
    cpus: "1.0"
    volumes:
      - ./:/app:ro
      - dev_node_modules:/app/node_modules
      - dev_build:/app/public/build

volumes:
  dev_storage:
  dev_build:
  dev_node_modules:
  malas_storage:
    external: true

networks:
  shared_net:
    external: true
