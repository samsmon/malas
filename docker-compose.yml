name: malas

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: malas:latest

services:
  app:
    <<: *app-image
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage:/var/www/html/storage
      - public_build:/var/www/html/public/build
    depends_on:
      db:
        condition: service_healthy

  queue:
    <<: *app-image
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file: .env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - public_build:/var/www/html/public/build:ro
      - storage:/var/www/html/storage:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-malas}
      POSTGRES_USER: ${DB_USERNAME:-malas}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-malas} -d ${DB_DATABASE:-malas}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  storage:
  public_build:
